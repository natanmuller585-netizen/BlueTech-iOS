name: Validar versao (sem publicar)

# Apenas valida. NUNCA cria Release, NUNCA sobe arquivo, NUNCA publica.
# Gatilhos: mudanca no version.json, disparo manual ou Release publicada.

on:
  push:
    paths:
      - version.json
  pull_request:
    paths:
      - version.json
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar version.json e anexos da Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
          API_URL: ${{ github.event.release.assets_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.request, zipfile, io
          from pathlib import Path

          path = Path("version.json")
          if not path.exists():
              sys.exit("version.json ausente neste commit")
          data = json.loads(path.read_text(encoding="utf-8"))

          required = ["app_name", "version", "build", "minimum_version",
                      "release_date", "update_available", "download_url",
                      "release_notes", "mandatory_update"]
          for key in required:
              if key not in data:
                  sys.exit("Campo obrigatorio ausente: " + key)

          semver = re.compile(r"^[0-9]+(?:\.[0-9]+){1,3}$")
          if not semver.match(str(data["version"])):
              sys.exit("Versao invalida: " + str(data["version"]))
          if not semver.match(str(data["minimum_version"])):
              sys.exit("Versao minima invalida")
          if not isinstance(data["build"], int) or data["build"] < 1:
              sys.exit("Build invalido")
          if not isinstance(data["release_notes"], list) or not data["release_notes"]:
              sys.exit("release_notes deve ser uma lista com pelo menos um item")
          if not all(isinstance(n, str) for n in data["release_notes"]):
              sys.exit("release_notes so aceita textos")

          prefix = "https://github.com/natanmuller585-netizen/BlueTech-iOS/releases/"
          url = str(data["download_url"])
          if not url.startswith(prefix):
              sys.exit("download_url precisa ser da Release oficial via HTTPS")
          sha = data.get("ipa_sha256")
          if sha is not None and not re.fullmatch(r"[0-9a-fA-F]{64}", str(sha)):
              sys.exit("ipa_sha256 invalido")
          android = data.get("android") or {}
          if android:
              apk_url = str(android.get("url", ""))
              if not apk_url.startswith(prefix + "download/"):
                  sys.exit("URL do APK precisa ser da Release oficial via HTTPS")
              apk_sha = str(android.get("sha256", ""))
              if not re.fullmatch(r"[0-9a-fA-F]{64}", apk_sha):
                  sys.exit("SHA-256 do APK invalido")
              if not isinstance(android.get("size"), int) or android["size"] < 1:
                  sys.exit("Tamanho do APK invalido")

          print("version.json OK:", data["version"], "build", data["build"])

          # Quando ha Release publicada, confere os anexos reais. Nada e publicado.
          if os.environ.get("EVENT") == "release":
              tag = os.environ.get("TAG", "")
              expected = "v" + str(data["version"])
              if tag != expected:
                  sys.exit(f"Tag {tag} nao bate com version.json ({expected})")
              if url != prefix + "tag/" + tag:
                  sys.exit("download_url nao aponta para esta Release")

              token = os.environ.get("GITHUB_TOKEN", "")
              api = os.environ.get("API_URL", "")
              if not api:
                  sys.exit("API da Release indisponivel na validacao")
              req = urllib.request.Request(
                  api, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "bluetech-validator",
                  })
              assets = json.load(urllib.request.urlopen(req, timeout=30))
              by_name = {a["name"]: a for a in assets}
              expected_files = {"Bluetech-iPhone.ipa": sha}
              if android:
                  expected_files["Bluetech-Android.apk"] = android["sha256"]
              for name, expected_sha in expected_files.items():
                  if name not in by_name:
                      sys.exit("Anexo ausente na Release: " + name)
                  download = by_name[name]["browser_download_url"]
                  if not download.startswith("https://github.com/"):
                      sys.exit("Download do anexo nao e HTTPS oficial")
                  blob = urllib.request.urlopen(
                      urllib.request.Request(download, headers={
                          "Authorization": "Bearer " + token,
                          "User-Agent": "bluetech-validator",
                      }), timeout=120).read()
                  actual = hashlib.sha256(blob).hexdigest()
                  if actual != str(expected_sha).lower():
                      sys.exit("SHA-256 nao confere para " + name)
                  if name.endswith(".ipa"):
                      with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                          plists = [n for n in zf.namelist()
                                    if re.match(r"^Payload/[^/]+\.app/Info\.plist$", n)]
                          if not plists:
                              sys.exit("IPA sem Payload/*.app/Info.plist")
                  print("Anexo conferido:", name, len(blob), "bytes")
              print("Release", tag, "validada (sem publicacao automatica)")
          PY
